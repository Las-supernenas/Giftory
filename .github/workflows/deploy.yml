name: Giftory CD

on:
  workflow_run:
    workflows: ["Giftory CI"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: giftory-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Giftory to EC2
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'Las-supernenas/Giftory'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # TEMPORARY: Diagnose the GitHub OIDC identity sent to AWS.
      # Remove this step after fixing the IAM trust policy.
      - name: Inspect GitHub OIDC identity
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.parse
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          separator = "&" if "?" in url else "?"
          request_url = url + separator + urllib.parse.urlencode({
              "audience": "sts.amazonaws.com"
          })

          request = urllib.request.Request(
              request_url,
              headers={"Authorization": "Bearer " + token}
          )

          with urllib.request.urlopen(request) as response:
              jwt = json.load(response)["value"]

          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("OIDC subject:", claims.get("sub"))
          print("OIDC audience:", claims.get("aud"))
          print("Repository:", claims.get("repository"))
          print("Ref:", claims.get("ref"))
          print("Event:", claims.get("event_name"))
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Send deployment command to EC2
        id: deploy
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          cat > deployment.sh <<'SCRIPT'
          set -Eeuo pipefail

          cd /home/ubuntu/Giftory

          echo "Checking repository..."
          if [ -n "$(runuser -u ubuntu -- git status --porcelain)" ]; then
            echo "ERROR: EC2 repository has uncommitted changes."
            exit 1
          fi

          echo "Fetching latest main..."
          runuser -u ubuntu -- git fetch origin main

          echo "Verifying deployment commit..."
          runuser -u ubuntu -- git cat-file -e "${DEPLOY_SHA}^{commit}"

          if ! runuser -u ubuntu -- git merge-base --is-ancestor "$DEPLOY_SHA" origin/main; then
            echo "ERROR: Deployment commit is not part of origin/main."
            exit 1
          fi

          LATEST_SHA=$(runuser -u ubuntu -- git rev-parse origin/main)

          if [ "$DEPLOY_SHA" != "$LATEST_SHA" ]; then
            echo "Skipping outdated deployment: $DEPLOY_SHA"
            echo "Latest main commit: $LATEST_SHA"
            exit 0
          fi

          echo "Checking out commit: $DEPLOY_SHA"
          runuser -u ubuntu -- git checkout -B main "$DEPLOY_SHA"

          echo "Starting PostgreSQL..."
          docker compose up -d db

          echo "Waiting for PostgreSQL..."
          READY=0

          for attempt in $(seq 1 30); do
            if docker compose exec -T db pg_isready >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: PostgreSQL did not become ready."
            exit 1
          fi

          echo "Building application images..."
          docker compose build backend frontend

          echo "Applying Prisma migrations..."
          docker compose run --rm backend npx prisma migrate deploy

          echo "Updating application containers..."
          docker compose up -d --remove-orphans

          echo "Checking containers..."
          docker compose ps

          echo "Waiting for application..."
          HEALTHY=0

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1/ -o /dev/null &&
               curl -fsS http://127.0.0.1/api/giftideas -o /dev/null; then
              HEALTHY=1
              break
            fi
            sleep 2
          done

          if [ "$HEALTHY" -ne 1 ]; then
            echo "ERROR: Application smoke tests failed."
            exit 1
          fi

          echo "Deployment successful: $DEPLOY_SHA"
          SCRIPT

          # Encode the deployment script for transport through AWS SSM.
          SCRIPT_B64=$(base64 -w 0 deployment.sh)

          jq -n \
            --arg command "echo '$SCRIPT_B64' | base64 -d | DEPLOY_SHA='$DEPLOY_SHA' bash -e" \
            '{commands: [$command], executionTimeout: ["1200"]}' \
            > parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://parameters.json \
            --timeout-seconds 60 \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command submitted: $COMMAND_ID"

      - name: Wait for deployment result
        if: steps.deploy.outputs.command_id != ''
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        shell: bash
        run: |
          set -euo pipefail

          STATUS="Pending"

          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || echo "Pending")

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac

            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed with status: $STATUS"
            exit 1
          fi

          echo "Giftory deployment completed successfully."
